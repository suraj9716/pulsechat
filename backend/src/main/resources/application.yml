server:
  port: ${PORT:${SERVER_PORT:8080}}
  compression:
    enabled: true
  error:
    include-message: never
    include-binding-errors: never

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  application:
    name: ano-chat-backend

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:postgres}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
        default_schema: anon
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    default-schema: anon

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 8

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

# JWT
app:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-for-production-change-this-in-env}
    access-token-validity-ms: 900000   # 15 min
    refresh-token-validity-ms: 604800000  # 7 days
    issuer: ano-chat

  rate-limit:
    requests-per-minute: 240
    burst: 300

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

logging:
  level:
    root: INFO
    com.anochat: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.web.socket: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
