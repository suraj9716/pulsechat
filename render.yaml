# Render Blueprint — https://render.com/docs/blueprint-spec
# Manual deploy: set Root Directory = backend, link Postgres + Redis env vars

databases:
  - name: pulsechat-db
    plan: free
    databaseName: pulsechat
    user: pulsechat

services:
  - type: web
    name: pulsechat-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://pulsechat.onrender.com
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: pulsechat-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      # Optional overrides if not using DATABASE_URL / REDIS_URL:
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"

  - type: web
    name: pulsechat-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist/frontend/browser
    envVars:
      - key: NODE_VERSION
        value: "20"
